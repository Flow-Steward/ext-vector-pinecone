{
  "manifest_version": 2,
  "extension_id": "flowsteward.pinecone",
  "kind": "tool_provider",
  "version": "1.0.4",
  "release_stage": "active",
  "display_name": "Pinecone Vector Database",
  "description": "Use Pinecone as a dense vector store for Flow Steward search and document retrieval workflows. Insert or update vectors with metadata, fetch or delete records by ID, list vectors by prefix, and query an embedding with metadata filters. Retrieval returns scores and source information such as record IDs, document IDs and stored text, so a later workflow step can assemble context for an answer or select related records.\n\nThe extension also manages index and namespace lifecycle: create a serverless index, list or inspect indexes, verify dimensions and metric, change deletion protection, and create, inspect, list or delete namespaces. Document replacement accepts prepared text chunks and their vectors, writes a new generation, and removes older generations; document deletion removes the selected document’s chunks.\n\nData operations use namespaces tied to the account, project and connection. Index administration operates at the wider Pinecone project level, so use a dedicated index when that separation matters. Supply embeddings and answer generation through other steps. Vector batches accept up to 100 records and searches return up to 50 matches, with pagination controls for larger record listings.",
  "lifecycle": {
    "data_schema_version": 1,
    "data_migrations": []
  },
  "vendor": {
    "name": "Flow Steward"
  },
  "listing": {
    "category": "data",
    "tags": [
      "pinecone",
      "vector",
      "rag"
    ],
    "summary": "Manage Pinecone dense vectors, indexes and namespaces, replace document chunks, and retrieve matches with source metadata.",
    "setup_summary": "Create a project Pinecone connection with index name, vector dimension, metric and secret API key; an optional index host can pin the expected endpoint. Use a ready dense index, or create a serverless index with cloud and region, and provide embeddings from a separate provider."
  },
  "features": [
    "tool",
    "action"
  ],
  "required_scopes": [
    "extension:invoke"
  ],
  "egress": {
    "connection_fields": [
      "pinecone.index_host"
    ],
    "hosts": [
      "api.pinecone.io",
      "*.pinecone.io"
    ]
  },
  "account_scope": {
    "scope_type": "project",
    "description": "Account, project and connection derived namespace isolation."
  },
  "entrypoint": {
    "mode": "subprocess",
    "command": [
      "python3",
      "main.py"
    ],
    "timeout_seconds": 60
  },
  "health": {
    "command": [
      "python3",
      "health.py"
    ],
    "timeout_seconds": 5
  },
  "ui_manifest": "ui/ui_manifest.yaml",
  "action_manifest": "ui/actions/actions.yaml",
  "python_requirements": [],
  "runtime": {
    "contract_version": "extension_host_v2",
    "compatibility": {
      "platform_min": "1.4.0"
    },
    "extension_contract_v2": {
      "connection_types": "contracts/connection_types.yaml",
      "operation_manifest": "contracts/operation_manifest.yaml",
      "step_ui_manifest": "contracts/step_ui_manifest.yaml"
    }
  },
  "external_effects": [
    {
      "operation_id": "create_index",
      "effect_kind": "database_write",
      "channel": "pinecone",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "create_namespace",
      "effect_kind": "database_write",
      "channel": "pinecone",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "delete_document",
      "effect_kind": "database_write",
      "channel": "pinecone",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "delete_index",
      "effect_kind": "database_write",
      "channel": "pinecone",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "delete_namespace",
      "effect_kind": "database_write",
      "channel": "pinecone",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "delete_vectors",
      "effect_kind": "database_write",
      "channel": "pinecone",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "replace_document",
      "effect_kind": "database_write",
      "channel": "pinecone",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "update_vector",
      "effect_kind": "database_write",
      "channel": "pinecone",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "upsert_vectors",
      "effect_kind": "database_write",
      "channel": "pinecone",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "configure_index_protection",
      "effect_kind": "database_write",
      "channel": "pinecone",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    }
  ],
  "machine_auth": {
    "service_account_key": "svc_ext_pinecone",
    "required_scopes": [
      "extension:invoke"
    ]
  }
}
