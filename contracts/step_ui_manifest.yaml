        },
        {
          "name": "ids",
          "widget_type": "json",
          "label": "Vector IDs (JSON array)",
          "required": true,
          "help_text": "Supply 1–100 explicit nonempty string IDs, each up to 512 UTF-8 bytes without whitespace or control characters. IDs belong to this logical namespace.",
          "placeholder": "[\"manual_42_part_1\",\"manual_42_part_2\"]"
        }
      ]
    },
