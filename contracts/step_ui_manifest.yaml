        {
          "name": "enabled",
          "widget_type": "boolean",
          "label": "Enable deletion protection",
          "required": true,
          "help_text": "Required boolean. true protects the entire index; false permits a later Delete an index action. The action does not itself delete any data."
        }
      ]
