{
  "forms": [
    {
      "operation_id": "create_index",
      "title": "Create a serverless vector index",
      "fields": [
        {
          "name": "namespace",
          "widget_type": "textarea",
          "label": "Logical namespace",
          "required": false,
          "help_text": "Optional logical name; default default. Use 1–64 letters, digits, underscores or hyphens. The connector adds account/project/connection isolation. Index administration ignores this field.",
          "placeholder": "knowledge_base"
        },
        {
          "name": "cloud",
          "widget_type": "textarea",
          "label": "Serverless cloud",
          "required": false,
          "help_text": "Cloud provider for a new index: aws (default), gcp or azure. Choose a region supported by that cloud and your Pinecone project.",
          "placeholder": "aws"
        },
        {
          "name": "region",
          "widget_type": "textarea",
          "label": "Serverless region",
          "required": true,
          "help_text": "Required cloud region for a new index. It must be supported by the selected cloud and Pinecone project.",
          "placeholder": "us-east-1"
        }
      ]
    },
