          "label": "Stable document ID",
          "required": true,
          "help_text": "Nonempty ID shared by all chunks of one document. Reuse it to replace or delete that document in this namespace.",
          "placeholder": "manual_42"
        },
        {
          "name": "chunks",
          "widget_type": "json",
          "label": "Document chunks and embeddings (JSON array)",
          "required": true,
          "help_text": "Supply 1–100 objects with text and values, plus optional flat metadata. Generate embeddings first. Replaces all earlier generations of this document after saving new chunks; partial writes can remain on failure. Example uses 3-dimensional vectors.",
          "placeholder": "[{\"text\":\"Refunds within 30 days.\",\"values\":[0.1,0.2,0.3],\"metadata\":{\"language\":\"en\"}}]"
        }
      ]
    },
