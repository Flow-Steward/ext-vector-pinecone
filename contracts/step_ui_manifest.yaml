    {
      "operation_id": "query_vectors",
      "title": "Search similar vectors",
      "fields": [
        {
          "name": "namespace",
          "widget_type": "textarea",
          "label": "Logical namespace",
          "required": false,
          "help_text": "Optional logical name; default default. Use 1–64 letters, digits, underscores or hyphens. The connector adds account/project/connection isolation. Index administration ignores this field.",
          "placeholder": "knowledge_base"
        },
        {
          "name": "vector",
          "widget_type": "json",
          "label": "Search embedding (JSON array)",
          "required": true,
          "help_text": "Finite numeric array from an embedding provider; use exactly the connection dimensions. Match the model used for stored records. The 3-value example is illustrative for a 3-dimensional index.",
          "placeholder": "[0.1,0.2,0.3]"
        },
        {
          "name": "top_k",
          "widget_type": "number",
          "label": "Maximum matching vectors",
          "required": false,
          "help_text": "Optional integer from 1 to 50; default 10. Scores depend on the index metric and are not percentages.",
          "placeholder": "5"
        },
        {
          "name": "filter",
          "widget_type": "json",
          "label": "Pinecone metadata filter (JSON)",
          "required": false,
          "help_text": "Optional Pinecone filter with supported comparison or logical operators. Filters restrict records within this namespace; omit to search all its vectors.",
          "placeholder": "{\"language\":{\"$eq\":\"en\"}}"
        }
      ]
    },
