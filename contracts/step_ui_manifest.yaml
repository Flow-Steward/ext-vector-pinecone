    {
      "operation_id": "update_vector",
      "title": "Update an embedding or merge metadata",
      "fields": [
        {
          "name": "namespace",
          "widget_type": "textarea",
          "label": "Logical namespace",
          "required": false,
          "help_text": "Optional logical name; default default. Use 1–64 letters, digits, underscores or hyphens. The connector adds account/project/connection isolation. Index administration ignores this field.",
          "placeholder": "knowledge_base"
        },
        {
          "name": "id",
          "widget_type": "textarea",
          "label": "Vector ID",
          "required": true,
          "help_text": "Existing record ID to update in this namespace. Supply embedding values, metadata or both.",
          "placeholder": "manual_42_part_1"
        },
        {
          "name": "values",
          "widget_type": "json",
          "label": "Replacement embedding (JSON array)",
          "required": false,
          "help_text": "Finite numeric array from an embedding provider; use exactly the connection dimensions. Match the model used for stored records. The 3-value example is illustrative for a 3-dimensional index.",
          "placeholder": "[0.1,0.2,0.3]"
        },
        {
          "name": "metadata",
          "widget_type": "json",
          "label": "Metadata fields to merge (JSON)",
          "required": false,
          "help_text": "Optional flat object of scalars or string lists; maximum 40 KiB. Supplied fields merge into the existing record using setMetadata. Keys starting _fs_ are reserved.",
          "placeholder": "{\"language\":\"en\",\"category\":\"refunds\"}"
        }
      ]
    },
    {
      "operation_id": "delete_vectors",
