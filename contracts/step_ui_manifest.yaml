        },
        {
          "name": "prefix",
          "widget_type": "textarea",
          "label": "Vector ID prefix",
          "required": false,
          "help_text": "Optional prefix for record IDs. Leave blank to list all IDs in this namespace.",
          "placeholder": "manual_42_"
        },
        {
          "name": "pagination_token",
          "widget_type": "textarea",
          "label": "Next-page token",
