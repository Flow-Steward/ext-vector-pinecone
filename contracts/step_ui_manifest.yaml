      "operation_id": "upsert_vectors",
      "title": "Save or replace vectors by ID",
      "fields": [
        {
          "name": "namespace",
          "widget_type": "textarea",
          "label": "Logical namespace",
          "required": false,
          "help_text": "Optional logical name; default default. Use 1–64 letters, digits, underscores or hyphens. The connector adds account/project/connection isolation. Index administration ignores this field.",
          "placeholder": "knowledge_base"
        },
        {
          "name": "vectors",
          "widget_type": "json",
          "label": "Vectors to save (JSON array)",
          "required": true,
          "help_text": "Supply 1–100 objects with unique id, values and optional flat metadata. Values must be finite and match connection dimensions. Metadata may contain scalars or string lists; _fs_ keys are reserved. The 3-value example needs a 3-dimensional index.",
          "placeholder": "[{\"id\":\"manual_42_part_1\",\"values\":[0.1,0.2,0.3],\"metadata\":{\"text\":\"Refunds within 30 days.\",\"language\":\"en\"}}]"
        }
      ]
    },
