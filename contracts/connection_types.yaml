{
  "connection_types": [
    {
      "connection_type_id": "pinecone",
      "display_name": "Pinecone",
      "description": "Verified Pinecone cloud endpoints; fixed dense index and isolated namespaces.",
      "config_schema": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "index",
          "dimension"
        ],
        "properties": {
          "index": {
            "type": "string",
            "pattern": "^[a-z0-9][a-z0-9-]{0,44}$"
          },
          "dimension": {
            "type": "integer",
            "minimum": 1,
            "maximum": 20000
          },
          "metric": {
            "type": "string",
            "enum": [
              "cosine",
              "euclidean",
              "dotproduct"
            ],
            "default": "cosine"
          },
          "index_host": {
            "type": "string"
          },
          "request_timeout_seconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 30,
            "default": 15
          }
        }
      },
      "secret_schema": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "api_key"
        ],
        "properties": {
          "api_key": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192
          }
        }
      },
      "capabilities": {
        "test_connection": false,
        "live_request": true,
        "workflow_trigger": false,
        "callback_ingress": false
      },
      "safety_profile": {
        "requires_https": true,
        "requires_host_allowlist": true,
        "stores_secret_values": false
      }
    }
  ]
}
